<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Portefeuille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Portefeuille</h1>
      <button type="button" onClick="{{toggleSelect}}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #0E0E1A; cursor: pointer">{{selectLabel}}</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6B7B"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5B3FE6"></span>Entrées (oct.)</span>
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; color: #0B8A43">1 860 000</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6B7B"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D92D20"></span>Sorties (oct.)</span>
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; color: #D92D20">615 000</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 112px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <sc-if value="{{r.isHeader}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 12px; font-weight: 700; color: #6B6B7B; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 4px 2px">{{r.label}}</span>
      </sc-if>
      <sc-if value="{{r.isTx}}" hint-placeholder-val="{{ true }}">
        <label style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 16px; padding: 12px 14px; min-height: 44px">
          <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
            <input type="checkbox" aria-label="Sélectionner {{r.title}}" style="width: 22px; height: 22px; accent-color: #5B3FE6; margin: 0">
          </sc-if>
          <span style="{{r.iconStyle}}">{{r.sign}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
            <span style="font-size: 12px; color: #6B6B7B">{{r.meta}}</span>
          </span>
          <span style="{{r.amountStyle}}">{{r.amount}}</span>
        </label>
      </sc-if>
    </sc-for>
  </div>

  <sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 12px 20px 100px; background: #FFFFFF; border-top: 1px solid #ECECF2">
      <button type="button" style="width: 100%; height: 50px; border-radius: 14px; border: 0; background: #D92D20; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Supprimer la sélection</button>
    </div>
  </sc-if>

  <nav aria-label="Navigation principale" style="position: absolute; left: 14px; right: 14px; bottom: 22px; height: 72px; border-radius: 36px; padding: 6px; box-sizing: border-box; display: flex; gap: 2px; align-items: stretch; background: linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.36)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(255,255,255,0.35), 0 14px 34px rgba(17,17,80,0.18), 0 2px 6px rgba(17,17,80,0.08)">
    <a href="Main.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a href="Stock.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Stock</a>
    <a href="Portefeuille.dc.html" aria-current="page" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3A20B8; font-weight: 700; background: linear-gradient(180deg, rgba(106,76,240,0.20), rgba(106,76,240,0.08)); box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 0 0 1px rgba(106,76,240,0.16)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Portefeuille</a>
    <a href="Factures.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Factures</a>
    <a href="Analyses.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>Analyses</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const f = s.filter || 'all';
const selecting = !!s.selecting;
const data = [
['Aujourd’hui', [
['sale', 'Robe wax · Taille M', 'Vente · 14:32', '25 000'],
['exp', 'Transport marchandises', 'Dépense · 11:05', '8 500'],
['sale', 'Sac en raphia ×2', 'Vente · Facture F-0142', '36 000']
]],
['Hier', [
['sale', 'Boubou brodé · L', 'Vente · 17:48', '45 000'],
['exp', 'Électricité boutique', 'Dépense · 09:12', '32 000'],
['sale', 'Foulard soie ×3', 'Vente · 08:40', '21 000']
]],
['13 octobre', [
['exp', 'Achat tissu wax', 'Dépense · 15:20', '180 000'],
['sale', 'Chemise bazin · M', 'Vente · 10:02', '22 000']
]]
];
const rows = [];
data.forEach(([day, txs]) => {
const kept = txs.filter((t) => f === 'all' || t[0] === f);
if (!kept.length) return;
rows.push({ isHeader: true, isTx: false, label: day });
kept.forEach(([k, title, meta, amt]) => rows.push({
isHeader: false, isTx: true, title, meta,
sign: k === 'sale' ? '+' : '−',
amount: (k === 'sale' ? '+' : '−') + amt,
iconStyle: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; ' + (k === 'sale' ? 'background: #E3F5EA; color: #0B6B39' : 'background: #FDE8EC; color: #D92D20'),
amountStyle: 'font-weight: 700; font-size: 14px; color: ' + (k === 'sale' ? '#0B8A43' : '#D92D20')
}));
});
const chips = [['all', 'Tout'], ['sale', 'Ventes'], ['exp', 'Dépenses']];
const base = 'min-height: 40px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';
return {
rows, selecting,
selectLabel: selecting ? 'Annuler' : 'Sélectionner',
toggleSelect: () => this.setState({ selecting: !selecting }),
filters: chips.map(([id, label]) => ({
label, pressed: id === f ? 'true' : 'false',
style: base + (id === f ? 'background: #0E0E1A; color: #FFFFFF; border: 1px solid #0E0E1A' : 'background: #FFFFFF; color: #0E0E1A; border: 1px solid #E2E2EA'),
pick: () => this.setState({ filter: id })
}))
};
}
}
</script>
</body>
</html>
