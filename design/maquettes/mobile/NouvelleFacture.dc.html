<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Nouvelle facture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Factures.dc.html" aria-label="Retour aux factures" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #ECECF2; display: flex; align-items: center; justify-content: center; color: #0E0E1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 22px">Facture F-0145</h1>
      <span style="font-size: 12px; font-weight: 700; color: #3F3F50">Brouillon · enregistré</span>
    </div>
    <button type="button" aria-label="Dupliquer la facture" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #ECECF2; display: flex; align-items: center; justify-content: center; color: #0E0E1A; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Client</span>
      <button type="button" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E2E2EA; border-radius: 16px; padding: 12px; font-family: inherit; text-align: left; cursor: pointer; color: #0E0E1A">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E6EEFF; color: #1F3FB8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">BP</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">Boutique Le Plateau</span><span style="font-size: 12px; color: #6B6B7B">Virement · Plateau, Abidjan</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Lignes</span>
      <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0F4">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px">Robe wax · Taille M</span><span style="font-size: 12px; color: #6B6B7B">4 × 25 000</span></span>
          <span style="font-weight: 700; font-size: 14px">100 000</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0F4">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px">Retouches sur mesure</span><span style="font-size: 12px; color: #6B6B7B">Ligne libre · 1 × 48 000</span></span>
          <span style="font-weight: 700; font-size: 14px">48 000</span>
        </div>
        <button type="button" style="display: flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 48px; border: 0; background: transparent; font-family: inherit; font-weight: 700; font-size: 14px; color: #5B3FE6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ajouter une ligne</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 600">Remise</span>
        <div role="group" aria-label="Type de remise" style="display: flex; gap: 2px; background: #E7E7EE; padding: 3px; border-radius: 10px">
          <button type="button" onClick="{{setPct}}" aria-pressed="{{pctOn}}" style="{{pctStyle}}">%</button>
          <button type="button" onClick="{{setAmt}}" aria-pressed="{{amtOn}}" style="{{amtStyle}}">FCFA</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="rem" style="font-size: 12px; color: #6B6B7B">Remise</label><input id="rem" value="{{remVal}}" style="height: 46px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 12px; padding: 0 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #0E0E1A"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="tva" style="font-size: 12px; color: #6B6B7B">Taxe (%)</label><input id="tva" value="0" style="height: 46px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 12px; padding: 0 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #0E0E1A"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="port" style="font-size: 12px; color: #6B6B7B">Livraison</label><input id="port" value="5 000" style="height: 46px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 12px; padding: 0 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #0E0E1A"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600">Thème de la facture</span>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" style="{{t.ring}}"><span style="{{t.dot}}"></span></button>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span style="color: #6B6B7B">Sous-total</span><span style="font-weight: 600">148 000</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #6B6B7B">Remise</span><span style="font-weight: 600">{{remLine}}</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #6B6B7B">Livraison</span><span style="font-weight: 600">+5 000</span></div>
      <div style="height: 1px; background: #F0F0F4; margin: 4px 0"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 700">Total</span><span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 22px">{{total}} F</span></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 14px 20px 30px; background: #FFFFFF; border-top: 1px solid #ECECF2">
    <button type="button" style="height: 52px; border-radius: 26px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 15px; color: #0E0E1A; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>PDF</button>
    <a href="Factures.dc.html" style="height: 52px; border-radius: 27px; background: radial-gradient(100% 140% at 20% 0%, #8C74FF 0%, #5B3FE6 50%, #3420B8 100%); box-shadow: 0 8px 20px rgba(75,47,214,0.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">Envoyer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const mode = s.mode || 'pct';
const theme = s.theme || 'vert';
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const disc = mode === 'pct' ? 14800 : 10000;
const on = 'min-width: 52px; min-height: 36px; border-radius: 8px; border: 0; background: #FFFFFF; color: #0E0E1A; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer';
const off = 'min-width: 52px; min-height: 36px; border-radius: 8px; border: 0; background: transparent; color: #6B6B7B; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer';
const th = [['vert', 'Vert forêt', '#5B3FE6'], ['ocre', 'Ocre', '#C98A1B'], ['encre', 'Encre', '#0E0E1A'], ['indigo', 'Indigo', '#1F3FB8']];
return {
pctOn: mode === 'pct' ? 'true' : 'false', amtOn: mode === 'amt' ? 'true' : 'false',
pctStyle: mode === 'pct' ? on : off, amtStyle: mode === 'amt' ? on : off,
setPct: () => this.setState({ mode: 'pct' }), setAmt: () => this.setState({ mode: 'amt' }),
remVal: mode === 'pct' ? '10' : '10 000',
remLine: '−' + fmt(disc),
total: fmt(148000 - disc + 5000),
themes: th.map(([id, label, c]) => ({
label: 'Thème ' + label, pressed: id === theme ? 'true' : 'false',
ring: 'width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; border: 2px solid ' + (id === theme ? '#0E0E1A' : '#ECECF2'),
dot: 'width: 32px; height: 32px; border-radius: 16px; background: ' + c,
pick: () => this.setState({ theme: id })
}))
};
}
}
</script>
</body>
</html>
