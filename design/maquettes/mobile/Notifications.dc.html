<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #ECECF2; display: flex; align-items: center; justify-content: center; color: #0E0E1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <h1 style="flex: 1; margin: 0; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 22px">Notifications</h1>
      <button type="button" onClick="{{readAll}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #5B3FE6; cursor: pointer">Tout marquer lu</button>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{list}}" as="n" hint-placeholder-count="5">
      <div style="{{n.card}}">
        <span style="{{n.iconWrap}}">{{n.glyph}}</span>
        <button type="button" onClick="{{n.read}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; border: 0; background: transparent; padding: 0; text-align: left; font-family: inherit; color: #0E0E1A; cursor: pointer">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="{{n.titleStyle}}">{{n.title}}</span>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}"><span aria-label="Non lue" style="width: 8px; height: 8px; border-radius: 4px; background: #E5484D; flex-shrink: 0"></span></sc-if>
          </span>
          <span style="font-size: 13px; line-height: 1.4; color: #3F3F50">{{n.body}}</span>
          <span style="font-size: 12px; color: #6B6B7B">{{n.time}}</span>
        </button>
        <button type="button" onClick="{{n.remove}}" aria-label="Supprimer la notification" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; color: #6B6B7B; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: -10px -10px 0 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 60px 20px; text-align: center; color: #6B6B7B; font-size: 14px">Aucune notification non lue.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const f = s.f || 'all';
const read = s.read || {};
const gone = s.gone || {};
const all = [
{ id: 1, kind: 'stock', title: 'Stock faible : Sac en raphia', body: 'Il reste 2 pièces, sous votre seuil de 5.', time: 'Il y a 12 min', unread: true },
{ id: 2, kind: 'stock', title: 'Stock faible : Pagne wax 6 yards', body: 'Il reste 3 pièces. Pensez à réapprovisionner.', time: 'Il y a 2 h', unread: true },
{ id: 3, kind: 'invoice', title: 'Facture F-0142 payée', body: 'M. Traoré Ibrahim a réglé 36 000 FCFA.', time: 'Hier, 16:20', unread: true },
{ id: 4, kind: 'stock', title: 'Stock faible : Bazin riche', body: 'Il reste 4 mètres en stock.', time: 'Hier, 09:02', unread: false },
{ id: 5, kind: 'team', title: 'Koffi a rejoint l’équipe', body: 'Votre collaborateur peut maintenant enregistrer des ventes.', time: '12 oct.', unread: false }
];
const styles = {
stock: ['!', 'background: #FFF0E0; color: #8A4B00'],
invoice: ['F', 'background: #EEEAFE; color: #5B3FE6'],
team: ['+', 'background: #E6EEFF; color: #1F3FB8']
};
const list = all.filter((n) => !gone[n.id]).map((n) => ({ ...n, unread: n.unread && !read[n.id] })).filter((n) => f === 'all' || n.unread);
const chips = [['all', 'Toutes'], ['unread', 'Non lues']];
const base = 'min-height: 40px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';
return {
empty: list.length === 0,
readAll: () => { const r = {}; all.forEach((n) => { r[n.id] = true; }); this.setState({ read: r }); },
filters: chips.map(([id, label]) => ({
label, pressed: id === f ? 'true' : 'false',
style: base + (id === f ? 'background: #0E0E1A; color: #FFFFFF; border: 1px solid #0E0E1A' : 'background: #FFFFFF; color: #0E0E1A; border: 1px solid #E2E2EA'),
pick: () => this.setState({ f: id })
})),
list: list.map((n) => ({
title: n.title, body: n.body, time: n.time, unread: n.unread,
glyph: styles[n.kind][0],
iconWrap: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: \'Plus Jakarta Sans\', sans-serif; font-weight: 700; font-size: 18px; ' + styles[n.kind][1],
card: 'display: flex; align-items: flex-start; gap: 12px; border-radius: 18px; padding: 14px; ' + (n.unread ? 'background: #FFFFFF; border: 1px solid #E2E2EA' : 'background: #F3F3F7; border: 1px solid #ECECF2'),
titleStyle: 'font-size: 14px; ' + (n.unread ? 'font-weight: 700' : 'font-weight: 600'),
read: () => this.setState({ read: { ...read, [n.id]: true } }),
remove: () => this.setState({ gone: { ...gone, [n.id]: true } })
}))
};
}
}
</script>
</body>
</html>
