<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Collaborateurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Parametres.dc.html" aria-label="Retour aux paramètres" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #ECECF2; display: flex; align-items: center; justify-content: center; color: #0E0E1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">Collaborateurs</h1>
    <button type="button" onClick="{{openSheet}}" aria-label="Ajouter un collaborateur" style="width: 48px; height: 48px; border-radius: 24px; border: 0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; background: radial-gradient(100% 100% at 30% 20%, #8C74FF, #3420B8); box-shadow: 0 8px 18px rgba(75,47,214,0.35)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 40px; display: flex; flex-direction: column; gap: 16px">
    <section style="border-radius: 24px; padding: 18px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(120% 120% at 100% 100%, #3A3AF0 0%, #1717A0 40%, #0A0A4A 85%); box-shadow: 0 14px 30px rgba(16,16,120,0.24)">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 700; font-size: 16px">Répartition des parts</span><span style="font-size: 13px; color: #C8C8F0">{{memberCount}} membres</span></div>
      <div role="img" aria-label="{{shareAria}}" style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4"><span style="{{m.bar}}"></span></sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: #DCDCF7">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 6px"><span style="{{m.dot}}"></span>{{m.first}} · {{m.share}}</span></sc-for>
      </div>
    </section>

    <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="{{m.avatar}}">{{m.ini}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{m.name}}</span><span style="font-size: 13px; color: #6B6B7B">{{m.role}}</span></span>
          <span style="font-size: 13px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: #EEEAFE; color: #3A20B8">{{m.share}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <a href="{{m.tel}}" style="flex: 1; min-height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 600; color: #0E0E1A; background: #F3F3F7"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>{{m.phone}}</a>
          <button type="button" style="min-height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #0E0E1A; cursor: pointer">Modifier</button>
          <button type="button" onClick="{{m.remove}}" aria-label="Retirer {{m.name}}" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid #F3C7CF; background: #FFFFFF; color: #A3213A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(14,14,26,0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; flex-direction: column; justify-content: flex-end">
      <section role="dialog" aria-modal="true" aria-labelledby="sheet-t" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 50px rgba(10,10,60,0.25)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D5D5DE"></span>
        <div style="display: flex; align-items: center; justify-content: space-between"><h2 id="sheet-t" style="margin: 0; font-size: 18px; font-weight: 800">Ajouter un collaborateur</h2><button type="button" onClick="{{closeSheet}}" aria-label="Fermer" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F3F3F7; color: #0E0E1A; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
        <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 28px; border: 1px dashed #B9B9C8; background: #F6F5FB; font-family: inherit; font-size: 13px; font-weight: 600; color: #3F3F50; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 20px; background: #EEEAFE; color: #4B2FD6; display: flex; align-items: center; justify-content: center; font-size: 18px">+</span>Ajouter une photo</button>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="sn" style="font-size: 13px; font-weight: 600">Nom complet</label><input id="sn" placeholder="Ex. Moussa Diallo" style="height: 50px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #0E0E1A"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="st" style="font-size: 13px; font-weight: 600">Téléphone</label><input id="st" type="tel" placeholder="+225 07 00 00 00 00" style="height: 50px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #0E0E1A"></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="sr" style="font-size: 13px; font-weight: 600">Rôle</label><select id="sr" style="height: 50px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 10px; font-family: inherit; font-size: 15px; color: #0E0E1A; background: #FFFFFF"><option>Vendeur</option><option>Associé</option><option>Couturier</option><option>Gestionnaire</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="sp" style="font-size: 13px; font-weight: 600">Part (%)</label><input id="sp" inputmode="numeric" value="10" style="height: 50px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #0E0E1A"></div>
        </div>
        <button type="button" onClick="{{add}}" style="height: 54px; border-radius: 27px; border: 0; font-family: inherit; font-weight: 700; font-size: 16px; color: #FFFFFF; cursor: pointer; background: radial-gradient(100% 140% at 20% 0%, #8C74FF 0%, #5B3FE6 50%, #3420B8 100%); box-shadow: 0 8px 20px rgba(75,47,214,0.3)">Ajouter à l'équipe</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const base = [
{ id: 1, name: 'Awa Koné', ini: 'AK', role: 'Gérante · propriétaire', phone: '07 00 00 00 10', share: 55 },
{ id: 2, name: 'Koffi Yao', ini: 'KY', role: 'Associé', phone: '05 00 00 00 11', share: 25 },
{ id: 3, name: 'Mariam Diabaté', ini: 'MD', role: 'Couturière', phone: '01 00 00 00 12', share: 12 },
{ id: 4, name: 'Yao Serge', ini: 'YS', role: 'Vendeur', phone: '07 00 00 00 13', share: 8 }
];
const list = s.list || base;
const colors = ['#FFFFFF', '#A58CFF', '#6A8CFF', '#C9BDFB', '#8CE0B4'];
const av = [['#EEEAFE', '#4B2FD6'], ['#E6EEFF', '#1F3FB8'], ['#FFF0E0', '#8A4B00'], ['#E8F6EE', '#0B6B39'], ['#FDE8EC', '#A3213A']];
return {
memberCount: list.length,
shareAria: list.map((m) => m.name + ' ' + m.share + ' %').join(', '),
members: list.map((m, i) => ({
name: m.name, first: m.name.split(' ')[0], ini: m.ini, role: m.role, phone: m.phone, share: m.share + ' %',
tel: 'tel:+225' + m.phone.replace(/\s/g, ''),
bar: 'display: block; height: 100%; flex: ' + m.share + ' 1 0; background: ' + colors[i % 5],
dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + colors[i % 5],
avatar: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; background: ' + av[i % 5][0] + '; color: ' + av[i % 5][1],
remove: () => this.setState({ list: list.filter((x) => x.id !== m.id) })
})),
sheetOpen: !!s.sheet,
openSheet: () => this.setState({ sheet: true }),
closeSheet: () => this.setState({ sheet: false }),
add: () => this.setState({ sheet: false, list: list.concat([{ id: Date.now(), name: 'Moussa Diallo', ini: 'MD', role: 'Vendeur', phone: '07 00 00 00 14', share: 10 }]) })
};
}
}
</script>
</body>
</html>
