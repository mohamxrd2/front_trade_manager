<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Profil entreprise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="flex: 1; overflow-y: auto; padding: 56px 24px 20px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; font-weight: 600; color: #6B6B7B">Étape 2 sur 3</span>
      <a href="Main.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 0">Passer</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 5px; border-radius: 3px; background: #5B3FE6"></span>
      <span style="height: 5px; border-radius: 3px; background: #5B3FE6"></span>
      <span style="height: 5px; border-radius: 3px; background: #E2E2EA"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em">Parlez-nous de votre entreprise</h1>
      <p style="margin: 0; font-size: 15px; color: #6B6B7B; line-height: 1.45">Ces informations apparaîtront sur vos factures.</p>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 1px dashed #B9B9C8; border-radius: 18px; padding: 14px; font-family: inherit; text-align: left; cursor: pointer; color: #0E0E1A">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #EEEAFE; color: #5B3FE6; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">Ajouter votre logo</span><span style="font-size: 13px; color: #6B6B7B">PNG ou JPG, carré de préférence</span></span>
    </button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="nom" style="font-size: 13px; font-weight: 600">Nom de l'entreprise</label>
      <input id="nom" value="Awa Couture" style="height: 52px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #0E0E1A">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600">Secteur d'activité</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{sectors}}" as="s" hint-placeholder-count="6">
          <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">{{s.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="siege" style="font-size: 13px; font-weight: 600">Siège</label>
      <input id="siege" value="Cocody, Abidjan" style="height: 52px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #0E0E1A">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="statut" style="font-size: 13px; font-weight: 600">Statut légal</label>
      <select id="statut" style="height: 52px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #0E0E1A">
        <option>Entreprise individuelle</option>
        <option>SARL</option>
        <option>SA</option>
        <option>Auto-entrepreneur</option>
      </select>
    </div>
  </div>

  <div style="padding: 14px 24px 32px; background: #F3F3F7; border-top: 1px solid #ECECF2">
    <a href="Main.dc.html" style="height: 54px; border-radius: 27px; background: radial-gradient(100% 140% at 20% 0%, #8C74FF 0%, #5B3FE6 50%, #3420B8 100%); box-shadow: 0 8px 20px rgba(75,47,214,0.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Continuer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 'Mode & textile';
const labels = ['Mode & textile', 'Alimentation', 'Cosmétique', 'Électronique', 'Services', 'Autre'];
const base = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ';
return {
sectors: labels.map((l) => ({
label: l,
pressed: l === picked ? 'true' : 'false',
style: base + (l === picked ? 'background: #5B3FE6; color: #FFFFFF; border: 1px solid #5B3FE6' : 'background: #FFFFFF; color: #0E0E1A; border: 1px solid #E2E2EA'),
pick: () => this.setState({ picked: l })
}))
};
}
}
</script>
</body>
</html>
