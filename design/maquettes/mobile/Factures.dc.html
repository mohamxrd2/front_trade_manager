<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Factures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FE6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F7; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Factures</h1>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #0E0E1A; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>Clients</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: radial-gradient(120% 90% at 100% 100%, #3A3AF0 0%, #1717A0 35%, #0A0A4A 70%, #06062A 100%); color: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: #C8C8F0">À encaisser</span>
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px">412 500</span>
        <span style="font-size: 12px; color: #C9BDFB; font-weight: 600">4 factures envoyées</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: #6B6B7B">Payé ce mois</span>
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; color: #0B8A43">986 000</span>
        <span style="font-size: 12px; color: #6B6B7B; font-weight: 600">11 factures</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 170px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{list}}" as="inv" hint-placeholder-count="5">
      <a href="NouvelleFacture.dc.html" style="display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border: 1px solid #ECECF2; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: #0E0E1A">
        <span style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; font-weight: 700; color: #6B6B7B">{{inv.num}}</span>
          <span style="{{inv.pill}}">{{inv.status}}</span>
        </span>
        <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-weight: 700; font-size: 15px">{{inv.client}}</span>
            <span style="font-size: 12px; color: #6B6B7B">{{inv.date}}</span>
          </span>
          <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 17px; white-space: nowrap">{{inv.amount}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <a href="NouvelleFacture.dc.html" style="position: absolute; right: 20px; bottom: 100px; height: 56px; padding: 0 22px; border-radius: 28px; background: #5B3FE6; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 8px 20px rgba(14,90,68,0.28)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle facture</a>

  <nav aria-label="Navigation principale" style="position: absolute; left: 14px; right: 14px; bottom: 22px; height: 72px; border-radius: 36px; padding: 6px; box-sizing: border-box; display: flex; gap: 2px; align-items: stretch; background: linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.36)); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(255,255,255,0.35), 0 14px 34px rgba(17,17,80,0.18), 0 2px 6px rgba(17,17,80,0.08)">
    <a href="Main.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a href="Stock.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Stock</a>
    <a href="Portefeuille.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Portefeuille</a>
    <a href="Factures.dc.html" aria-current="page" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3A20B8; font-weight: 700; background: linear-gradient(180deg, rgba(106,76,240,0.20), rgba(106,76,240,0.08)); box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 0 0 1px rgba(106,76,240,0.16)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Factures</a>
    <a href="Analyses.dc.html" style="flex: 1 1 0; min-width: 0; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; letter-spacing: -0.01em; white-space: nowrap; color: #3F3F50; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>Analyses</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const f = (this.state && this.state.filter) || 'all';
const pills = {
draft: ['Brouillon', 'background: #EDEDF2; color: #3F3F50'],
sent: ['Envoyée', 'background: #FFF0E0; color: #8A4B00'],
paid: ['Payée', 'background: #E3F5EA; color: #0B6B39']
};
const all = [
['F-0145', 'Boutique Le Plateau', '15 oct. 2026', '148 000 F', 'draft'],
['F-0144', 'Mme Kouassi Aya', '14 oct. 2026', '62 500 F', 'sent'],
['F-0143', 'Hôtel Assinie Beach', '12 oct. 2026', '275 000 F', 'sent'],
['F-0142', 'M. Traoré Ibrahim', '10 oct. 2026', '36 000 F', 'paid'],
['F-0141', 'Atelier Yopougon', '8 oct. 2026', '190 000 F', 'paid'],
['F-0140', 'Mme Bamba Fatou', '5 oct. 2026', '75 000 F', 'sent']
];
const chips = [['all', 'Toutes'], ['draft', 'Brouillons'], ['sent', 'Envoyées'], ['paid', 'Payées']];
const base = 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; ';
return {
filters: chips.map(([id, label]) => ({
label, pressed: id === f ? 'true' : 'false',
style: base + (id === f ? 'background: #0E0E1A; color: #FFFFFF; border: 1px solid #0E0E1A' : 'background: #FFFFFF; color: #0E0E1A; border: 1px solid #E2E2EA'),
pick: () => this.setState({ filter: id })
})),
list: all.filter((x) => f === 'all' || x[4] === f).map(([num, client, date, amount, st]) => ({
num, client, date, amount, status: pills[st][0],
pill: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; ' + pills[st][1]
}))
};
}
}
</script>
</body>
</html>
