<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Collaborateurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4B2FD6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 20px; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; background: radial-gradient(700px 480px at 0% 0%, rgba(106,76,240,0.22), rgba(106,76,240,0) 70%), radial-gradient(800px 560px at 100% 10%, rgba(58,58,240,0.14), rgba(58,58,240,0) 70%), #F1F2F7">
<div style="max-width: 1480px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
  <div style="flex: 1 1 240px; min-width: 0"><dc-import name="WebSidebar" active="collaborateurs" hint-size="100%,820px"></dc-import></div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 4px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Collaborateurs</h1>
      <span style="font-size: 14px; color: #6B6B7B">L'équipe associée à Awa Couture</span>
    </div>

    <section style="border-radius: 26px; padding: 22px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(120% 140% at 100% 100%, #3A3AF0 0%, #1717A0 40%, #0A0A4A 85%); box-shadow: 0 14px 30px rgba(16,16,120,0.24)">
      <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px"><span style="font-weight: 700; font-size: 17px">Répartition des parts</span><span style="font-size: 13px; color: #C8C8F0">{{memberCount}} membres</span></div>
      <div role="img" aria-label="{{shareAria}}" style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 3px">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4"><span style="{{m.bar}}"></span></sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #DCDCF7">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 6px"><span style="{{m.dot}}"></span>{{m.first}} · {{m.share}}</span></sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div style="flex: 3 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 14px">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="4">
          <div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 18px rgba(17,17,80,0.05)">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="{{m.avatar}}">{{m.ini}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px">{{m.name}}</span><span style="font-size: 13px; color: #6B6B7B">{{m.role}}</span></span>
            </div>
            <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px"><dt style="color: #6B6B7B">Téléphone</dt><dd style="margin: 0; font-weight: 600">{{m.phone}}</dd><dt style="color: #6B6B7B">Part</dt><dd style="margin: 0; font-weight: 700; color: #3A20B8">{{m.share}}</dd></dl>
            <div style="display: flex; gap: 8px"><button type="button" style="flex: 1; min-height: 40px; border-radius: 20px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 13px; color: #0E0E1A; cursor: pointer">Modifier</button><button type="button" onClick="{{m.remove}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #F3C7CF; background: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 13px; color: #A3213A; cursor: pointer">Retirer</button></div>
          </div>
        </sc-for>
      </div>

      <aside aria-label="Ajouter un collaborateur" style="flex: 2 1 320px; min-width: 0; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.5)); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.9); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), 0 20px 50px rgba(17,17,80,0.10)">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Ajouter un collaborateur</h2>
        <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 30px; border: 1px dashed #B9B9C8; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #3F3F50; cursor: pointer"><span style="width: 44px; height: 44px; border-radius: 22px; background: #EEEAFE; color: #4B2FD6; display: flex; align-items: center; justify-content: center; font-size: 20px">+</span>Ajouter une photo</button>
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="cn" style="font-size: 13px; font-weight: 600">Nom complet</label><input id="cn" placeholder="Ex. Moussa Diallo" style="height: 48px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 14px; color: #0E0E1A; background: #FFFFFF"></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="ct" style="font-size: 13px; font-weight: 600">Téléphone</label><input id="ct" placeholder="+225 …" style="height: 48px; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 14px; color: #0E0E1A; background: #FFFFFF"></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="cr" style="font-size: 13px; font-weight: 600">Rôle</label><select id="cr" style="height: 48px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 10px; font-family: inherit; font-size: 14px; color: #0E0E1A; background: #FFFFFF"><option>Vendeur</option><option>Associé</option><option>Couturier</option><option>Gestionnaire</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 8px"><label for="cp" style="font-size: 13px; font-weight: 600">Part (%)</label><input id="cp" value="10" style="height: 48px; min-width: 0; box-sizing: border-box; border: 1px solid #E2E2EA; border-radius: 14px; padding: 0 14px; font-family: inherit; font-size: 14px; color: #0E0E1A; background: #FFFFFF"></div>
        </div>
        <button type="button" onClick="{{add}}" style="min-height: 50px; border-radius: 25px; border: 0; font-family: inherit; font-weight: 700; font-size: 15px; color: #FFFFFF; cursor: pointer; background: radial-gradient(100% 140% at 20% 0%, #8C74FF 0%, #5B3FE6 50%, #3420B8 100%); box-shadow: 0 8px 20px rgba(75,47,214,0.3)">Ajouter à l'équipe</button>
      </aside>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const base = [
{ id: 1, name: 'Awa Koné', ini: 'AK', role: 'Gérante · propriétaire', phone: '+225 07 00 00 00 10', share: 55 },
{ id: 2, name: 'Koffi Yao', ini: 'KY', role: 'Associé', phone: '+225 05 00 00 00 11', share: 25 },
{ id: 3, name: 'Mariam Diabaté', ini: 'MD', role: 'Couturière', phone: '+225 01 00 00 00 12', share: 12 },
{ id: 4, name: 'Yao Serge', ini: 'YS', role: 'Vendeur', phone: '+225 07 00 00 00 13', share: 8 }
];
const list = s.list || base;
const colors = ['#FFFFFF', '#A58CFF', '#6A8CFF', '#C9BDFB', '#8CE0B4'];
const av = [['#EEEAFE', '#4B2FD6'], ['#E6EEFF', '#1F3FB8'], ['#FFF0E0', '#8A4B00'], ['#E8F6EE', '#0B6B39'], ['#FDE8EC', '#A3213A']];
return {
memberCount: list.length,
shareAria: list.map((m) => m.name + ' ' + m.share + ' %').join(', '),
members: list.map((m, i) => ({
name: m.name, first: m.name.split(' ')[0], ini: m.ini, role: m.role, phone: m.phone, share: m.share + ' %',
bar: 'display: block; height: 100%; flex: ' + m.share + ' 1 0; background: ' + colors[i % 5],
dot: 'width: 10px; height: 10px; border-radius: 5px; background: ' + colors[i % 5],
avatar: 'width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; background: ' + av[i % 5][0] + '; color: ' + av[i % 5][1],
remove: () => this.setState({ list: list.filter((x) => x.id !== m.id) })
})),
add: () => this.setState({ list: list.concat([{ id: Date.now(), name: 'Moussa Diallo', ini: 'MD', role: 'Vendeur', phone: '+225 07 00 00 00 14', share: 10 }]) })
};
}
}
</script>
</body>
</html>
