<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Waelly — Portefeuille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4B2FD6}a:hover{color:#3A20B8}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 20px; color: #0E0E1A; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif; background: radial-gradient(700px 480px at 0% 0%, rgba(106,76,240,0.22), rgba(106,76,240,0) 70%), radial-gradient(800px 560px at 100% 10%, rgba(58,58,240,0.14), rgba(58,58,240,0) 70%), #F1F2F7">
<div style="max-width: 1480px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
  <div style="flex: 1 1 240px; min-width: 0"><dc-import name="WebSidebar" active="portefeuille" hint-size="100%,820px"></dc-import></div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 4px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Portefeuille</h1>
        <span style="font-size: 14px; color: #6B6B7B">Toutes vos ventes et dépenses</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <a href="Web-Vente.dc.html" style="height: 48px; padding: 0 18px; border-radius: 24px; display: flex; align-items: center; text-decoration: none; font-weight: 700; font-size: 14px; color: #0E0E1A; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.95)">− Dépense</a>
        <a href="Web-Vente.dc.html" style="height: 48px; padding: 0 20px; border-radius: 24px; display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; background: radial-gradient(100% 140% at 20% 0%, #8C74FF 0%, #5B3FE6 50%, #3420B8 100%); box-shadow: 0 8px 20px rgba(75,47,214,0.35)">+ Vente</a>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px">
      <div style="border-radius: 24px; padding: 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 6px; background: radial-gradient(120% 120% at 100% 100%, #3A3AF0 0%, #1717A0 40%, #0A0A4A 85%); box-shadow: 0 14px 30px rgba(16,16,120,0.24)"><span style="font-size: 13px; color: #C8C8F0">Solde · octobre</span><span style="font-weight: 700; font-size: 30px; letter-spacing: -0.02em">1 245 000 F</span></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(17,17,80,0.05)"><span style="font-size: 13px; color: #6B6B7B">Entrées</span><span style="font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: #0B8A43">+1 860 000 F</span></div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 18px rgba(17,17,80,0.05)"><span style="font-size: 13px; color: #6B6B7B">Sorties</span><span style="font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: #D92D20">−615 000 F</span></div>
    </div>

    <section style="background: #FFFFFF; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 18px rgba(17,17,80,0.05)">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <label for="pp" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Période</label>
          <select id="pp" style="height: 42px; border-radius: 21px; border: 1px solid #E2E2EA; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 13px; font-weight: 600; color: #0E0E1A"><option>Octobre 2026</option><option>Septembre 2026</option><option>30 derniers jours</option><option>Personnalisé…</option></select>
          <button type="button" style="height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid #E2E2EA; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #0E0E1A; cursor: pointer">Exporter</button>
        </div>
      </div>

      <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 18px; border-radius: 20px; background: #0E0E1A; color: #FFFFFF">
          <span style="font-weight: 600; font-size: 14px">{{selLabel}}</span>
          <span style="display: flex; gap: 8px"><button type="button" onClick="{{clearSel}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer">Annuler</button><button type="button" onClick="{{deleteSel}}" style="min-height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #E5484D; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Supprimer</button></span>
        </div>
      </sc-if>

      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="text-align: left; color: #6B6B7B; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em">
              <th style="padding: 10px 8px; width: 36px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Sélection</span></th><th style="padding: 10px 8px; font-weight: 600">Opération</th><th style="padding: 10px 8px; font-weight: 600">Type</th><th style="padding: 10px 8px; font-weight: 600">Date</th><th style="padding: 10px 8px; font-weight: 600">Facture</th><th style="padding: 10px 8px; font-weight: 600; text-align: right">Montant</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr style="{{r.rowStyle}}">
                <td style="padding: 10px 8px"><button type="button" role="checkbox" aria-checked="{{r.checked}}" aria-label="Sélectionner {{r.title}}" onClick="{{r.toggle}}" style="{{r.box}}">{{r.tick}}</button></td>
                <td style="padding: 10px 8px"><span style="display: flex; align-items: center; gap: 12px"><span style="{{r.icon}}">{{r.sign}}</span><span style="font-weight: 600">{{r.title}}</span></span></td>
                <td style="padding: 10px 8px"><span style="{{r.pill}}">{{r.type}}</span></td>
                <td style="padding: 10px 8px; color: #4B4B5C; white-space: nowrap">{{r.date}}</td>
                <td style="padding: 10px 8px; color: #3A20B8; font-weight: 600">{{r.inv}}</td>
                <td style="{{r.amtStyle}}">{{r.amt}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const f = s.f || 'all';
const sel = s.sel || {};
const gone = s.gone || {};
const data = [
[1, 'Robe wax · Taille M', 'sale', '15 oct. · 14:32', '—', '25 000'],
[2, 'Transport marchandises', 'exp', '15 oct. · 11:05', '—', '8 500'],
[3, 'Sac en raphia ×2', 'sale', '15 oct. · 10:20', 'F-0142', '36 000'],
[4, 'Boubou brodé · L', 'sale', '14 oct. · 17:48', '—', '45 000'],
[5, 'Électricité boutique', 'exp', '14 oct. · 09:12', '—', '32 000'],
[6, 'Chemise bazin · M', 'sale', '12 oct. · 10:02', 'F-0143', '22 000'],
[7, 'Foulard soie ×3', 'sale', '10 oct. · 16:15', '—', '21 000'],
[8, 'Achat tissu wax', 'exp', '6 oct. · 15:20', '—', '180 000'],
[9, 'Robe wax · Taille S ×3', 'sale', '3 oct. · 11:40', 'F-0140', '75 000']
];
const rows = data.filter((d) => !gone[d[0]] && (f === 'all' || d[2] === f));
const n = Object.keys(sel).filter((k) => sel[k]).length;
const chips = [['all', 'Tout'], ['sale', 'Ventes'], ['exp', 'Dépenses']];
return {
filters: chips.map(([id, label]) => ({
label, pressed: id === f ? 'true' : 'false',
style: 'min-height: 40px; padding: 0 16px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (id === f ? 'background: #0E0E1A; color: #FFFFFF; border: 1px solid #0E0E1A' : 'background: #FFFFFF; color: #3F3F50; border: 1px solid #E2E2EA'),
pick: () => this.setState({ f: id })
})),
hasSel: n > 0,
selLabel: n + ' opération(s) sélectionnée(s)',
clearSel: () => this.setState({ sel: {} }),
deleteSel: () => { const g = Object.assign({}, gone); Object.keys(sel).forEach((k) => { if (sel[k]) g[k] = true; }); this.setState({ gone: g, sel: {} }); },
rows: rows.map(([id, title, k, date, inv, amt]) => ({
title, date, inv, checked: sel[id] ? 'true' : 'false', tick: sel[id] ? '✓' : '',
type: k === 'sale' ? 'Vente' : 'Dépense',
sign: k === 'sale' ? '+' : '−',
amt: (k === 'sale' ? '+' : '−') + amt + ' F',
toggle: () => this.setState({ sel: Object.assign({}, sel, { [id]: !sel[id] }) }),
rowStyle: 'border-top: 1px solid #F0F0F4; background: ' + (sel[id] ? '#F4F1FF' : 'transparent'),
box: 'width: 24px; height: 24px; padding: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; cursor: pointer; ' + (sel[id] ? 'background: #5B3FE6; color: #FFFFFF; border: 0' : 'background: #FFFFFF; color: #FFFFFF; border: 1.5px solid #C9C9D6'),
icon: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; ' + (k === 'sale' ? 'background: #E3F5EA; color: #0B6B39' : 'background: #FDE8EC; color: #D92D20'),
pill: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; ' + (k === 'sale' ? 'background: #E3F5EA; color: #0B6B39' : 'background: #FDE8EC; color: #A3213A'),
amtStyle: 'padding: 10px 8px; text-align: right; font-weight: 700; white-space: nowrap; color: ' + (k === 'sale' ? '#0B8A43' : '#D92D20')
}))
};
}
}
</script>
</body>
</html>
